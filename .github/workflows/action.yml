name: Build and Deploy Facsciences

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

jobs:
  build-test:
    name: Build & Test React
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Créer le fichier .env à partir des Secrets
      - name: Setup .env
        run: |
          echo "VITE_BACKEND_PREINSCRIPTION=${{ secrets.VITE_BACKEND_PREINSCRIPTION }}" >> .env
          echo "VITE_BACKEND_FACSCIENCES=${{ secrets.VITE_BACKEND_FACSCIENCES }}" >> .env
          echo "VITE_BACKEND_WEBSERVICES=${{ secrets.VITE_BACKEND_WEBSERVICES }}" >> .env
          echo "VITE_BACKEND_ADMIN=${{ secrets.VITE_BACKEND_ADMIN }}" >> .env

      # 4. Installer les dépendances
      - name: Install dependencies
        run: npm install

      # 5. Tests
      - name: Run tests (optional)
        run: npm test --if-present

      # 6. Build React
      - name: Build project
        run: npm run build

      # 7. Sauvegarder le build comme artefact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist

  deploy:
    name: Deploy to Server
    needs: build-test

    # Déploiement UNIQUEMENT après un push sur main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      # 8. Télécharger le build du job précédent
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: build

      # 9. Rejoindre le réseau Tailscale
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.VPS_HOST }}

      # 10. Nettoyer le dossier cible sur le serveur
      - name: Clean target folder
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            rm -rf /var/www/facscience/*

      # 11. Copier le build dans le dossier cible
      - name: Copy build to folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "build/*"
          target: "/var/www/facscience"
          strip_components: 1